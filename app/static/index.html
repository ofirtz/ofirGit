<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>חיפוש מלון זול</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: Heebo, Arial, sans-serif; background:#f7f7fb; color:#121212; margin:0; }
    .container { max-width: 720px; margin: 48px auto; padding: 24px; background:#fff; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); }
    h1 { margin-top:0; font-weight:600; font-size: 28px; }
    form { display:grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    label { font-size: 14px; color:#333; }
    input { width:100%; padding: 10px 12px; border:1px solid #e0e0e6; border-radius: 8px; font-size: 16px; }
    .col-span-2 { grid-column: span 2; }
    button { background:#4f46e5; color:#fff; border:none; border-radius: 8px; padding: 12px 16px; font-size:16px; cursor:pointer; }
    button:hover { background:#4338ca; }
    .result, .error { margin-top: 20px; padding: 16px; border-radius: 10px; }
    .result { background:#eef2ff; color:#1e1b4b; border:1px solid #c7d2fe; }
    .error { background:#fee2e2; color:#7f1d1d; border:1px solid #fecaca; }
    .footer { margin-top: 24px; color:#666; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>מציאת המלון הזול ביותר</h1>
    <form id="search-form">
      <div class="col-span-2">
        <label for="destination">יעד (עיר או אזור)</label>
        <input id="destination" name="destination" placeholder="למשל: תל אביב / North" required />
      </div>
      <div>
        <label for="check_in">תאריך כניסה</label>
        <input id="check_in" name="check_in" type="date" required />
      </div>
      <div>
        <label for="check_out">תאריך יציאה</label>
        <input id="check_out" name="check_out" type="date" required />
      </div>
      <div class="col-span-2">
        <button type="submit">חפש</button>
      </div>
    </form>

    <div id="message" class="error" style="display:none"></div>
    <div id="result" class="result" style="display:none"></div>

    <div class="footer">מסמכי API זמינים ב- <a href="/docs" target="_blank">/docs</a></div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
